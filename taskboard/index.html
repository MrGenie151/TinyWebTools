<!DOCTYPE html>
<html>

<head>
	<title>Taskboard</title>
	
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<style>
		body {
			font-family: "Roboto", sans-serif;
		}

		footer {
			text-align: center;
		}

		.task-card {
			border-color: black;
			border-style: dashed;
			display: flex;
		}

		.task-card * {
			display: flex;
			flex: 1 1 0px;
		}

		.right-align {
			text-align: right;
		}
	</style>
</head>

<body>
	<h2>Taskboard</h2>
	<p>
		<p>Welcome to Taskboard :3</p>
		<p>Open the menu to add a task and a deadline (either relative or exact) to get started.</p>
	</p>
	<details open>
		<summary>Task creation dropdown</summary>
		<div>
			<div>
				<label for="taskname">Task name:</label>
				<input type="text" name="taskname" id="taskname">
			</div>
			<div>
				<label for="taskenddate">Task End Date and Time:</label>
				<input type="datetime-local" name="taskenddate" id="taskenddate">
			</div>
			<button onclick="addTask()">Add Task</button>
		</div>
	</details>
	<div id="task-container">

	</div>
	<footer>
		<p>created with love by <a href="geniecmd.xyz">Genie</a>!</p>
		<p><a href="./index.html" download="Taskboard.html">Download this page</a> and use it offline!</p>
	</footer>

	<script type="text/template" id="taskbox-template">
		<div class="task-card">
			<p>Task: {{taskname}}</p>
			<p class="right-align">{{timeLeft}}</p>
			<button onclick="removeTask({{index}})">Remove Task</button>
		</div>
	</script>

	<script>
		let taskContainer = document.getElementById("task-container");
		let template = document.getElementById("taskbox-template");
		let templateHTML = template.innerHTML;

		let taskNameBox = document.getElementById("taskname");
		let taskDateBox = document.getElementById("taskenddate");

		class Task {
			Name = "";
			EndTime = Temporal.Now.plainDateTimeISO();

			constructor(name, date) {
				this.Name = name
				this.EndTime = Temporal.PlainDateTime.from(date || Temporal.Now.plainDateTimeISO().toString())
			}

			static from(json){
				return Object.assign(new Task(), json);
			}
		}

		let tasks = fetchFromLocalStorage() || []

		function updateLocalStorage() {
			localStorage.setItem("taskboard",JSON.stringify(tasks))
		}

		function fetchFromLocalStorage() {
			let data = JSON.parse(localStorage.getItem("taskboard"))

			if (data != null) {
				console.log("yeag")
				let realData = [];
				data.forEach(element => {
					let newTask = Task.from(element);
					newTask.EndTime = Temporal.PlainDateTime.from(newTask.EndTime)
					realData.push(newTask)
				});
				return realData
			} else {
				console.log("nog")
			}
		}

		function constructTaskBox(task,index) {
			console.log(task.Name)
			let timeRemaining = task.EndTime.since(Temporal.Now.plainDateTimeISO());
			let timeString = timeRemaining.days + "d " + timeRemaining.hours + "h " +
                            timeRemaining.minutes + "m " + timeRemaining.seconds + "s ";
			return templateHTML.replace("{{taskname}}",task.Name)
				.replace("{{timeLeft}}",timeString)
				.replace("{{index}}",index)
		}

		function updateTasks() {
			let newTaskHTML = "";
			tasks.forEach((task, index) => {
				newTaskHTML += constructTaskBox(task,index);
			})

			taskContainer.innerHTML = newTaskHTML;
			console.log("refresh")
		}

		function addTask() {
			let newTaskName = taskNameBox.value;
			let newTaskDate = taskDateBox.value;
			let newTask = new Task(newTaskName,newTaskDate)
			tasks.push(newTask)
			updateLocalStorage()
			updateTasks()
		}

		function removeTask(index) {
			tasks.splice(index,1);
			updateLocalStorage()
			updateTasks()
		}

		updateTasks()
		setInterval(updateTasks,1000)
	</script>
</body>

</html>
